    <!-- Application Logic -->
    <script>
        const APP_VERSION = "1.6.2";
        
        // --- DATA (Answer split into 'a': Answer and 'e': Explanation) ---
        const masterData = [
            // 第1章：音の性質
            { c: 1, q: "音の振動の振れ幅を何といいますか？", a: "振幅", e: "振幅は音の大きさに関係します。" },
            { c: 1, q: "振幅が大きくなると、音はどうなりますか？", a: "大きくなる", e: "逆に振幅が小さいと音は小さくなります。" },
            { c: 1, q: "音源が1秒間に振動する回数を何といいますか？", a: "振動数", e: "音の高さに関係します。" },
            { c: 1, q: "振動数が多くなると、音の高さはどうなりますか？", a: "高くなる", e: "振動数が少ないと低い音になります。" },
            { c: 1, q: "振動数の単位は何ですか？", a: "Hz（ヘルツ）", e: "1秒間に100回振動すれば100Hzです。" },
            { c: 1, q: "音が出ているとき、音源の物体はどうなっていますか？", a: "振動している", e: "震えていないと音は出ません。" },
            { c: 1, q: "空気中を伝わる音の速さは、およそ毎秒何mですか？", a: "約340m/s", e: "気温15℃のとき約340m/sです。" },
            { c: 1, q: "光と音では、どちらが伝わる速さが速いですか？", a: "光", e: "光は30万km/sと圧倒的に速いです。" },
            { c: 1, q: "花火が見えてから音が聞こえるまでに時間がかかるのはなぜですか？", a: "光の速さに比べて、音の速さが非常に遅いから", e: "光は一瞬で届きますが、音は遅れて届きます。" },
            { c: 1, q: "音を伝える物質がない真空の中では、音は聞こえますか？", a: "聞こえない", e: "音は空気が振動して伝わるため、空気がないと伝わりません。" },
            { c: 1, q: "モノコードの弦をより強く張ると、音の高さはどうなりますか？", a: "高くなる", e: "弦をピンと張るほど、振動数が多くなります。" },
            { c: 1, q: "モノコードの弦をより細いものに変えると、音の高さはどうなりますか？", a: "高くなる", e: "細い弦や軽い弦は振動しやすいです。" },
            { c: 1, q: "モノコードの駒を動かして弦の長さを短くすると、音の高さはどうなりますか？", a: "高くなる", e: "短い弦は速く振動します。" },
            { c: 1, q: "弦を強くはじくと、音の大きさはどうなりますか？", a: "大きくなる", e: "大きくはじくと振幅が大きくなります。" },
            { c: 1, q: "オシロスコープの波形で、音の大きさを表すのは縦・横どちらの幅ですか？", a: "縦の幅（振幅）", e: "波の高さが高いほど大きな音です。" },
            { c: 1, q: "オシロスコープの波形で、音の高さに関係するのは縦・横どちらの幅ですか？", a: "横の幅（振動の間隔）", e: "波の間隔が狭い（数が多い）ほど高い音です。" },
            { c: 1, q: "振動数が多くなると、波形の山の数はどうなりますか？", a: "多く（密に）なる", e: "同じ時間内にたくさんの波が入ります。" },
            { c: 1, q: "高い壁に向かって声を出したとき、はね返って聞こえる音を何といいますか？", a: "こだま（やまびこ）", e: "音の反射による現象です。" },
            { c: 1, q: "音が水面にふれると、水面はどうなりますか？", a: "水しぶきが上がる", e: "音の振動が水に伝わるからです。" },
            { c: 1, q: "容器内の空気を抜いていくと、中のブザーの音はどうなりますか？", a: "小さくなる（聞こえなくなる）", e: "伝える物質（空気）が減るためです。" },

            { c: 4, q: "力の大きさが4Nのとき、反対向きに何Nの力を加えればつり合いますか？", a: "4N", e: "つり合う条件：大きさが等しく、向きが反対。" },
            { c: 4, q: "500gの物体を台ばかりに乗せ、ばねで上に引いた。ばねののびが3.6cm（1Nで1cmのびる）のとき、台ばかりの示す値は何gですか？", a: "140g", e: "ばねの力：3.6cmなので3.6N(360g分)で引いている。\n重力：500g。\n台ばかりへの力：500 - 360 = 140g" },
            { c: 4, q: "前問で、台ばかりの値が150gになったとき、ばねののびは何cmですか？", a: "3.5cm", e: "ばねが支えている分：500g - 150g = 350g (3.5N)。\n1Nで1cmなので、3.5cmのびる。" },
            { c: 4, q: "20gのおもり1個で2cmのびるばねに、120gのおもりを吊るすと何cmのびますか？", a: "12cm", e: "重さが6倍(120÷20)なので、のびも6倍。\n2cm × 6 = 12cm" },
            { c: 4, q: "前問のばねで、全長が26cmになったとき（元の長さ20cm）、おもりがばねを引く力は何Nですか？", a: "0.6N", e: "のび：26 - 20 = 6cm。\n2cmで20gなので、6cmなら60g。\n60g = 0.6N" },
            { c: 4, q: "方眼の1目盛りが3Nを表すとき、15Nの力を表す矢印は何目盛り分ですか？", a: "5目盛り", e: "式：15N ÷ 3N/目盛り = 5目盛り" }
        ];

        // --- STATE & UTILS ---
        let currentQuestions = [], currentIndex = 0, isFlipped = false, selectedChapter = 'all', selectedMode = 'sequential';
        let reviewList = [], isReviewMode = false;
        let isQuickMode = false; // Flag to indicate if we are in quick mode

        const screens = { setup: document.getElementById('setup-screen'), study: document.getElementById('study-screen'), completion: document.getElementById('completion-screen') };
        const els = { 
            card: document.getElementById('card'), questionText: document.getElementById('question-text'), 
            answerText: document.getElementById('answer-text'), explanationText: document.getElementById('explanation-text'),
            explanationContainer: document.getElementById('explanation-container'),
            progressBar: document.getElementById('progress-bar'), progressText: document.getElementById('progress-text'), 
            chapterBadge: document.getElementById('chapter-badge'), version: document.getElementById('app-version'), 
            frontControls: document.getElementById('front-controls'), backControls: document.getElementById('back-controls'),
            completionEmoji: document.getElementById('completion-emoji'), completionTitle: document.getElementById('completion-title'), 
            completionMsg: document.getElementById('completion-msg'), totalCount: document.getElementById('total-count'), 
            reviewCount: document.getElementById('review-count'), btnStartReview: document.getElementById('btn-start-review') 
        };

        window.onload = () => { els.version.textContent = APP_VERSION; };

        // Font Size Adjuster based on character count
        function getFontSizeClass(text, isQuestion) {
            if (!text) return isQuestion ? "text-lg" : "text-2xl"; // Safety check
            const len = text.length;
            if (isQuestion) {
                if (len <= 15) return "text-3xl md:text-5xl";
                if (len <= 30) return "text-2xl md:text-4xl";
                if (len <= 60) return "text-xl md:text-3xl";
                return "text-lg md:text-2xl";
            } else {
                // Answer
                if (len <= 5) return "text-5xl md:text-7xl";
                if (len <= 10) return "text-4xl md:text-6xl";
                if (len <= 20) return "text-3xl md:text-5xl";
                return "text-2xl md:text-4xl";
            }
        }

        // Setup & Start
        function selectChapter(chap) {
            selectedChapter = chap;
            document.querySelectorAll('.chapter-btn').forEach((btn, idx) => {
                const isSelected = (chap === 'all' && idx === 0) || (chap === idx);
                btn.className = `chapter-btn w-full py-4 px-5 rounded-xl border-2 transition-colors text-left flex justify-between items-center group ${isSelected ? 'border-blue-500 bg-blue-50 ring-2 ring-blue-300' : 'border-slate-100 hover:border-blue-400 hover:bg-slate-50'}`;
            });
        }
        selectChapter('all');

        function setMode(mode) {
            selectedMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                const isThisMode = btn.textContent.trim().includes(mode === 'sequential' ? '順番' : 'ランダム');
                btn.className = `mode-btn flex-1 py-3 rounded-xl border-2 font-bold text-base transition-all ${isThisMode ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-slate-200 text-slate-500 hover:border-blue-300'}`;
            });
        }

        // --- SPECIAL MODES (NEW) ---
        function startQuickMode(type) {
            let pool = [];
            let limit = 0;

            if (type === 'basic') {
                // Chapter 1 & 2, 10 Questions
                pool = masterData.filter(q => q.c === 1 || q.c === 2);
                limit = 10;
                isQuickMode = true; // Mark as quick mode
            } else if (type === 'calc') {
                // Chapter 3 & 4, 5 Questions
                pool = masterData.filter(q => q.c === 3 || q.c === 4);
                limit = 5;
                isQuickMode = true;
            }

            if (pool.length === 0) return;

            shuffleArray(pool);
            currentQuestions = pool.slice(0, limit);

            // Standard Start Logic
            initSession();
        }

        function startApp() {
            // Standard Mode
            if (selectedChapter === 'all') currentQuestions = [...masterData];
            else currentQuestions = masterData.filter(q => q.c === selectedChapter);
            
            if (selectedMode === 'random') shuffleArray(currentQuestions);
            
            isQuickMode = false;
            initSession();
        }

        function initSession() {
            currentIndex = 0; isFlipped = false; reviewList = []; isReviewMode = false;
            els.card.classList.remove('rotate-y-180');
            updateControlsVisibility(false);
            switchScreen('study');
            renderCard();
            updateProgress();
        }

        function startReviewMode() {
            currentQuestions = [...reviewList];
            reviewList = []; isReviewMode = true; currentIndex = 0; isFlipped = false;
            els.card.classList.remove('rotate-y-180');
            updateControlsVisibility(false);
            switchScreen('study');
            renderCard();
            updateProgress();
        }

        // Render
        function renderCard() {
            const q = currentQuestions[currentIndex];
            els.questionText.textContent = q.q;
            els.answerText.textContent = q.a;
            els.explanationText.innerText = q.e || ""; 

            // Apply dynamic font size
            els.questionText.className = `font-bold leading-snug text-slate-800 transition-all duration-300 ${getFontSizeClass(q.q, true)}`;
            els.answerText.className = `font-bold text-indigo-700 leading-snug transition-all duration-300 ${getFontSizeClass(q.a, false)}`;

            // Badge
            let badge = isReviewMode ? "復習モード" : "音の性質";
            if (!isReviewMode) {
                if (q.c === 2) badge = "力のはたらき";
                else if (q.c === 3) badge = "音（計算）";
                else if (q.c === 4) badge = "力（計算）";
            }
            els.chapterBadge.textContent = badge;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                els.card.classList.add('rotate-y-180');
                updateControlsVisibility(true);
            } else {
                els.card.classList.remove('rotate-y-180');
                updateControlsVisibility(false);
            }
        }

        function updateControlsVisibility(isBack) {
            if (isBack) {
                els.frontControls.classList.add('hidden');
                els.backControls.classList.remove('hidden'); els.backControls.classList.add('fade-in');
            } else {
                els.frontControls.classList.remove('hidden');
                els.backControls.classList.add('hidden'); els.backControls.classList.remove('fade-in');
            }
        }

        function handleResult(result) {
            if (result === 'review') reviewList.push(currentQuestions[currentIndex]);
            
            els.card.classList.remove('rotate-y-180');
            isFlipped = false;
            updateControlsVisibility(false);
            
            setTimeout(() => {
                if (currentIndex < currentQuestions.length - 1) {
                    currentIndex++; renderCard(); updateProgress();
                } else {
                    finishApp();
                }
            }, 300);
        }

        function updateProgress() {
            const current = currentIndex + 1, total = currentQuestions.length;
            els.progressBar.style.width = `${(current / total) * 100}%`;
            els.progressText.textContent = `${current} / ${total}`;
        }

        function finishApp() {
            switchScreen('completion');
            els.totalCount.textContent = currentQuestions.length;
            els.reviewCount.textContent = reviewList.length;
            
            if (reviewList.length > 0) {
                els.completionEmoji.textContent = "💪";
                els.completionTitle.textContent = "復習のチャンス！";
                els.completionMsg.textContent = `${reviewList.length}問の「不安な問題」があります。\n今すぐ復習して定着させましょう！`;
                els.btnStartReview.classList.remove('hidden');
            } else {
                els.completionEmoji.textContent = "🏆";
                els.completionTitle.textContent = (isReviewMode || isQuickMode) ? "テスト完了！" : "完璧です！";
                els.completionMsg.textContent = "素晴らしい集中力です！";
                els.btnStartReview.classList.add('hidden');
            }
        }

        function resetToMenu() {
            reviewList = []; isReviewMode = false; isQuickMode = false;
            switchScreen('setup');
        }

        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
    </script>
</body>
</html>
