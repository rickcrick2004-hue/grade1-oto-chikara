                    <button onclick="selectChapter(4)" class="chapter-btn w-full py-3 px-4 rounded-lg border-2 border-slate-100 hover:border-purple-500 hover:bg-purple-50 transition-colors text-left flex justify-between items-center group">

            { c: 3, q: "振動数が120Hzの音（波形ア）と、同じ時間内にその3倍の数の波が記録された音（波形イ）があるとき、音イの振動数は何Hzですか？", a: "360Hz （120Hz × 3 = 360Hz）" },
            { c: 3, q: "400Hzの音の波形に対して、同じ時間幅の中に1.5倍の数の波がある別の音の振動数は何Hzですか？", a: "600Hz （400Hz × 1.5 = 600Hz）" },
            { c: 3, q: "校舎の壁から10m離れた地点で音を出し、壁で反射した音との時間間隔が0.058秒でした。このときの音の速さは何m/sですか？（四捨五入して整数で）", a: "345m/s （10m × 2 ÷ 0.058s ≒ 344.8...m/s）" },
            { c: 3, q: "音の速さを測る実験を3回行い、時間が0.39秒、0.40秒、0.41秒でした。138mの距離を伝わった平均の音速は何m/sですか？", a: "345m/s （平均時間0.40秒、138m ÷ 0.40s = 345m/s）" },

            // 第4章：力のはたらき（計算） -- 旧第3章
            { c: 4, q: "地球上で質量100gの物体にはたらく重力の大きさは約何Nですか？", a: "約1N" },
            { c: 4, q: "地球上で質量300gの物体にはたらく重力の大きさは何Nですか？", a: "3N" },
            { c: 4, q: "質量2kgの物体にはたらく重力の大きさは何Nですか？（100g=1Nとする）", a: "20N" },
            { c: 4, q: "0.1Nの力で1cmのびるばねに、0.4Nの力を加えると何cmのびますか？", a: "4cm" },
            { c: 4, q: "1Nで2cmのびるばねに3Nの力を加えると、のびは何cmになりますか？", a: "6cm" },
            { c: 4, q: "月の重力は地球の約何分の1ですか？", a: "6分の1" },
            { c: 4, q: "地球上で質量60gの物体の質量は、月面上では何gですか？", a: "60g" },
            { c: 4, q: "地球上で重さ0.6Nの物体の重さは、月面上では何Nになりますか？", a: "0.1N" },
            { c: 4, q: "月面上で180gの物体をばねばかりでつるすと、何Nを示しますか？", a: "0.3N" },
            { c: 4, q: "元の長さが6.0cmのばねに100gのおもりをつるすと全長が6.8cmになりました。200gのおもりをつるすと全長は何cmになりますか？", a: "7.6cm" },
            { c: 4, q: "ばねののびが2.5cmのとき、おもりの質量は何gですか？（0.1Nで1cmのびる場合）", a: "250g" },
            { c: 4, q: "図で1Nを1cmの矢印で表すとき、3Nの力は何cmの矢印で書きますか？", a: "3cm" },
            { c: 4, q: "机の上に置いた5Nの物体に、机から受ける垂直抗力は何Nですか？", a: "5N" },
            { c: 4, q: "床に置いた物体を1.5Nで水平に押したが動かなかった。このときの摩擦力は何Nですか？", a: "1.5N" },
            { c: 4, q: "2本のばねA, Bを縦につなぎ、下端に0.6Nのおもりを吊るした。それぞれのばねが受ける力は何Nですか？", a: "ともに0.6N" },
            { c: 4, q: "0.1Nで1cmのびるばねA, Bを並列に並べて棒で吊るし、棒の中央に0.6Nのおもりを下げた。各ばねののびは何cmですか？", a: "3cm" },
            { c: 4, q: "300gの物体をばねでゆっくり引き上げ、ばねが6cmのびたところで床から離れた。このばねを5cmのばすのに必要な力は何Nですか？", a: "2.5N" },
            { c: 4, q: "前問で、ばねののびが2cmのとき、物体が床を押す力は何Nですか？", a: "2N" },
            { c: 4, q: "100gで2cmのびるばねに、あるおもりを吊るすと8cmのびた。おもりの質量は何gですか？", a: "400g" },
            { c: 4, q: "質量150gの物体が月面上で上皿てんびんに乗っている。反対側には何gの分銅を乗せればつり合いますか？", a: "150g" },
            { c: 4, q: "0.5Nで0.8cmのびるばねに、350gのおもりを吊るすと何cmのびますか？", a: "5.6cm" },
            { c: 4, q: "元の長さが12.0cmで、0.4Nで0.2cmのびるばねに160gのおもりを吊るしたときの全長は何cmですか？", a: "12.8cm" },
            { c: 4, q: "グラフで、0.2Nでばねののびが2.0cmのとき、このばねの比例定数（1Nあたりののび）は何cm/Nですか？", a: "10cm/N" },
            { c: 4, q: "400gの物体を月面上でばねばかりに吊るすと、地球上の何gの物体と同じ値を示しますか？", a: "約66.7g（400÷6）" },
            { c: 4, q: "力の大きさが4Nのとき、反対向きに何Nの力を加えればつり合いますか？", a: "4N" },
            { c: 4, q: "500gの物体を台ばかりに乗せ、ばねで上に引いた。ばねののびが3.6cm（1Nで1cmのびる）のとき、台ばかりの示す値は何gですか？", a: "140g" },
            { c: 4, q: "前問で、台ばかりの値が150gになったとき、ばねののびは何cmですか？", a: "3.5cm" },
            { c: 4, q: "20gのおもり1個で2cmのびるばねに、120gのおもりを吊るすと何cmのびますか？", a: "12cm" },
            { c: 4, q: "前問のばねで、全長が26cmになったとき（元の長さ20cm）、おもりがばねを引く力は何Nですか？", a: "0.6N" },
            { c: 4, q: "方眼の1目盛りが3Nを表すとき、15Nの力を表す矢印は何目盛り分ですか？", a: "5目盛り" }
        ];

        // --- STATE MANAGEMENT ---
        let currentQuestions = [];
        let currentIndex = 0;
        let isFlipped = false;
        let selectedChapter = 'all'; // 'all', 1, 2, 3, 4
        let selectedMode = 'sequential'; // 'sequential', 'random'

        // --- DOM ELEMENTS ---
        const screens = {
            setup: document.getElementById('setup-screen'),
            study: document.getElementById('study-screen'),
            completion: document.getElementById('completion-screen')
        };
        const els = {
            card: document.getElementById('card'),
            questionText: document.getElementById('question-text'),
            answerText: document.getElementById('answer-text'),
            progressBar: document.getElementById('progress-bar'),
            progressText: document.getElementById('progress-text'),
            chapterBadge: document.getElementById('chapter-badge'),
            nextBtn: document.getElementById('next-btn'),
            version: document.getElementById('app-version')
        };

        // --- INITIALIZATION ---
        window.onload = () => {
            els.version.textContent = APP_VERSION;
        };

        // --- ACTIONS ---

        // 1. Setup Selection
        function selectChapter(chap) {
            selectedChapter = chap;
            // Update visual state of buttons
            const btns = document.querySelectorAll('.chapter-btn');
            btns.forEach((btn, idx) => {
                // Determine if this button corresponds to the selection
                // Logic: idx 0 is 'all', idx 1 is ch1, idx 2 is ch2, idx 3 is ch3, idx 4 is ch4
                const isSelected = (chap === 'all' && idx === 0) || (chap === idx);
                
                // Toggle styles based on selection logic
                if (isSelected) {
                    btn.classList.add('border-blue-500', 'bg-blue-50', 'ring-2', 'ring-blue-300');
                    btn.classList.remove('border-slate-100');
                } else {
                    btn.classList.remove('border-blue-500', 'bg-blue-50', 'ring-2', 'ring-blue-300');
                    btn.classList.add('border-slate-100');
                }
            });
        }

        // Initialize default selection UI
        selectChapter('all');

        function setMode(mode) {
            selectedMode = mode;
            const btns = document.querySelectorAll('.mode-btn');
            btns.forEach(btn => {
                const isThisMode = btn.textContent.trim().includes(mode === 'sequential' ? '順番' : 'ランダム');
                if (isThisMode) {
                    btn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                    btn.classList.remove('border-slate-200', 'text-slate-500');
                } else {
                    btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                    btn.classList.add('border-slate-200', 'text-slate-500');
                }
            });
        }

        // 2. Start Logic
        function startApp() {
            // Filter questions
            if (selectedChapter === 'all') {
                currentQuestions = [...masterData];
            } else {
                currentQuestions = masterData.filter(q => q.c === selectedChapter);
            }

            // Shuffle if random mode
            if (selectedMode === 'random') {
                shuffleArray(currentQuestions);
            }

            // Reset state
            currentIndex = 0;
            isFlipped = false;
            els.card.classList.remove('rotate-y-180');

            // Switch screens
            screens.setup.classList.add('hidden');
            screens.completion.classList.add('hidden');
            screens.study.classList.remove('hidden');

            renderCard();
            updateProgress();
        }

        // 3. Card Logic
        function renderCard() {
            const q = currentQuestions[currentIndex];
            els.questionText.textContent = q.q;
            els.answerText.textContent = q.a;
            
            // Set Badge text
            let badge = "";
            if (q.c === 1) badge = "音の性質";
            else if (q.c === 2) badge = "力のはたらき";
            else if (q.c === 3) badge = "音の性質（計算）";
            else if (q.c === 4) badge = "力（計算）";
            els.chapterBadge.textContent = badge;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                els.card.classList.add('rotate-y-180');
            } else {
                els.card.classList.remove('rotate-y-180');
            }
        }

        function nextCard() {
            // Flip back first if needed
            if (isFlipped) {
                flipCard();
                // Wait slightly for animation before changing content, 
                // but for speed, users prefer instant. Let's do instant content change after 200ms
                setTimeout(() => proceed(), 300);
            } else {
                proceed();
            }

            function proceed() {
                if (currentIndex < currentQuestions.length - 1) {
                    currentIndex++;
                    renderCard();
                    updateProgress();
                } else {
                    finishApp();
                }
            }
        }

        function updateProgress() {
            const current = currentIndex + 1;
            const total = currentQuestions.length;
            const percentage = (current / total) * 100;
            
            els.progressBar.style.width = `${percentage}%`;
            els.progressText.textContent = `${current} / ${total}`;
        }

        // 4. Completion
        function finishApp() {
            screens.study.classList.add('hidden');
            screens.completion.classList.remove('hidden');
            document.getElementById('total-count').textContent = currentQuestions.length;
            
            const msgEl = document.getElementById('completion-msg');
            if (selectedChapter === 'all') {
                msgEl.textContent = "全範囲の確認完了！これでテストもバッチリですね。";
            } else {
                msgEl.textContent = "この章はマスターしましたね！他の章も挑戦しましょう。";
            }
        }

        function resetToMenu() {
            screens.study.classList.add('hidden');
            screens.completion.classList.add('hidden');
            screens.setup.classList.remove('hidden');
        }

        // --- UTILS ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

    </script>
</body>
</html>
